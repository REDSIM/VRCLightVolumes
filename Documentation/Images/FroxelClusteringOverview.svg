<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Coarse and Fine clustering narrow each cell's light list</title><desc id="desc">A camera frustum has a Coarse grid with six depth slices and four angular divisions. Bulb symbols identify lights A, B and C. Dashed circles show their complete ranges, including areas outside the frustum. Each cell contains letters for the light ranges it overlaps; cells with no overlap are blank. A highlighted Coarse cell contains AB and excludes C. Lines connect that cell to an enlarged view with four-by-four Fine cells. Fine checks only A and B; each child cell is labeled A, B or AB according to its overlaps. The highlighted Fine cell keeps only A, because B cannot reach it.</desc><defs><clipPath id="zoom-view"><rect x="710" y="132" width="460" height="482" rx="10"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c4ced8"/></marker></defs><rect width="1200" height="780" fill="#30343b" rx="12"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="51" font-size="30" fill="#f4f6f9" font-weight="700">Coarse</text><text x="40" y="87" font-size="23" fill="#c4ced8" >Check all lights</text><text x="720" y="51" font-size="30" fill="#f4f6f9" font-weight="700">Fine</text><text x="720" y="87" font-size="23" fill="#c4ced8" >Check only A + B</text><polygon points="140,356.2 580,145 580,625 140,413.8" fill="#282f37" /><circle cx="312" cy="230" r="100" fill="#ffd18c" fill-opacity="0.085" stroke="#ffd18c" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="8 6"/><circle cx="454" cy="355" r="120" fill="#80d9f2" fill-opacity="0.085" stroke="#80d9f2" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="8 6"/><circle cx="244" cy="515" r="82" fill="#eaa2c8" fill-opacity="0.085" stroke="#eaa2c8" stroke-opacity="0.8" stroke-width="2"