<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="title desc"><title id="title">Froxel projection selects the Hi-Z level</title><desc id="desc">Schematic of the player camera and its widening froxel grid. Blue froxel A is smaller and orange froxel B is larger. Dashed rays from a separate light project each whole froxel onto the light’s shadow map. A covers a small area and uses a finer Hi-Z level. B covers a larger area and uses a coarser level. Colored outlines in the two right-hand maps show the projected areas; tinted grid cells hold the values read for each test. Both maps cover the same field of view. The selected level depends on the projection from the light.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2cdd7"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#80d9f2"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffd18c"/></marker></defs><rect x="0" y="0" width="1200" height="756" fill="#30343b" rx="12"/><g font-family="Arial, Helvetica, sans-serif"><polygon points="150,428.5 644.531,220.797 644.531,699.203 150,491.5" fill="#252c34" /><polygon points="385,65 187.5,436.375 243.75,460" fill="#80d9f2" fill-opacity="0.055"/><line x1="385" y1="65" x2="187.5" y2="436.375" stroke="#80d9f2" stroke-width="1.8" stroke-dasharray="7 6" stroke-opacity="0.8"/><line x1="385" y1="65" x2="243.75" y2="460" stroke="#80d9f2" stroke-width="1.8" stroke-dasharray="7 6" stroke-opacity="0.8"/><polygon points="385,65 454.688,460 644.531,340.398" fill="#ffd18c" fill-opacity="0.055"/><line x1="385" y1="65" x2="454.6875" y2="460" stroke="#ffd18c" stroke-width="1.8" stroke-da