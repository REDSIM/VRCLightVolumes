<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img"><title>Two lighting workflows</title><desc>Baked room lighting fills Regular Light Volumes during a normal lightmap bake. Point Light Volumes calculate changing lights at runtime, with a separate shadow bake when needed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9baabe" stroke-width="1.5"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="2" fill="#7acdb3" opacity=".6"/></pattern></defs><rect width="100%" height="100%" rx="14" fill="#131922"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e7edf6"><text x="36" y="50" font-size="28" font-weight="600">Two lighting workflows</text><text x="36" y="85" font-size="17" fill="#c4cede">Use baked lighting as the base. Add changing lights where the scene needs them.</text><text x="36" y="141" font-size="16" fill="#80dbc0">BAKED ROOM LIGHTING</text><g fill="#203035" stroke="#43665f"><rect x="36" y="165" width="280" height="122" rx="8"/><rect x="415" y="165" width="280" height="122" rx="8"/><rect x="794" y="165" width="290" height="122" rx="8"/></g><text x="58" y="201" font-size="21" fill="#edf4fc">Unity / Bakery lights</text><text x="58" y="232" font-size="17" fill="#c4cede">Static room + Light Volume</text><text x="58" y="258" font-size="17" fill="#c4cede">bounds</text><text x="437" y="201" font-size="21" fill="#edf4fc">Bake scene lighting</text><text x="437" y="232" font-size="17" fill="#c4cede">Use the selected lightmapper.</text><text x="437" y="258" font-size="17" fill="#c4cede">Packing follows automatically.</text><text x="816" y="201" font-size="21" fill="#edf4fc">Stored room lighting</text><text x="816" y="232" font-size="17" fill="#c4cede">Lightmaps: static surfaces</text><text x="816" y="258" font-size="17" fill="#c4cede">Volumes: compatible receivers</text><path d="M326 225H401" fill="none" stroke="#9baabe" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 225H780" fill="none" stroke="#9baabe" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="340" font-size="16" fill="#8abcff">LIGHTS THAT CHANGE IN GAME</text><g fill="#213248" stroke="#496583"><rect x="36" y="361" width="280" height="88" rx="8"/><rect x="415" y="361" width="280" height="88" rx="8"/><rect x="794" y="361" width="290" height="88" rx="8"/></g><text x="58" y="395" font-size="21" fill="#edf4fc">Point / Spot / Area</text><text x="58" y="423" font-size="17" fill="#c4cede">Point Light Volume component</text><text x="437" y="395" font-size="20" fill="#edf4fc">Calculate while rendering</text><text x="437" y="423" font-size="16" fill="#c4cede">No room bake needed to light up.</text><text x="816" y="395" font-size="21" fill="#edf4fc">Need shadows?</text><text x="816" y="423" font-size="16" fill="#c4cede">Bake or update them separately.</text><path d="M326 405H401" fill="none" stroke="#9baabe" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 405H780" fill="none" stroke="#9baabe" stroke-width="2" marker-end="url(#arrow)"/></g></svg>