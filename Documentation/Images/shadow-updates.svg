<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img"><title>When do shadows need a new bake?</title><desc>A fixed light and fixed blocker can use a baked shadow while a receiver moves. A moving blocker requires a new shadow capture to show its new position.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9baabe" stroke-width="1.5"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="2" fill="#7acdb3" opacity=".6"/></pattern></defs><rect width="100%" height="100%" rx="14" fill="#131922"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e7edf6"><text x="36" y="50" font-size="28" font-weight="600">When do shadows need a new bake?</text><text x="36" y="84" font-size="17" fill="#c4cede">A shadow map remembers the blockers seen from the light at capture time.</text><path d="M559 120V420" stroke="#374456"/><text x="36" y="135" font-size="23" fill="#80dbc0">Receiver moves</text><text x="588" y="135" font-size="23" fill="#ffc878">Blocker moves</text><path d="M58 362H510" stroke="#69788d" stroke-width="5"/><path d="M105 213L305 362H490Z" fill="#ffcf78" opacity=".12"/><circle cx="105" cy="213" r="17" fill="#ffe1a4"/><text x="65" y="182" font-size="16" fill="#c4cede">fixed light</text><path d="M610 362H1062" stroke="#69788d" stroke-width="5"/><path d="M657 213L857 362H1042Z" fill="#ffcf78" opacity=".12"/><circle cx="657" cy="213" r="17" fill="#ffe1a4"/><text x="617" y="182" font-size="16" fill="#c4cede">fixed light</text><rect x="250" y="257" width="35" height="105" fill="#94a9bf"/><path d="M287 362H456" stroke="#070b11" stroke-width="12"/><circle cx="402" cy="277" r="15" fill="#80dbc0"/><path d="M346 277H378" fill="none" stroke="#9baabe" stroke-width="2" marker-end="url(#arrow)"/><text x="334" y="318" font-size="16" fill="#c4cede">moving prop</text><text x="209" y="243" font-size="16" fill="#c4cede">fixed blocker</text><rect x="802" y="257" width="35" height="105" fill="none" stroke="#8390a2" stroke-width="2" stroke-dasharray="6 4"/><rect x="928" y="257" width="35" height="105" fill="#94a9bf"/><path d="M839 362H1008" stroke="#070b11" stroke-width="12"/><path d="M847 279H916" fill="none" stroke="#9baabe" stroke-width="2" marker-end="url(#arrow)"/><text x="793" y="240" font-size="15" fill="#c4cede">old position</text><text x="917" y="240" font-size="15" fill="#c4cede">new position</text><text x="36" y="412" font-size="21" fill="#80dbc0">A baked shadow still works.</text><text x="36" y="443" font-size="18" fill="#c4cede">Keep the light and its blockers fixed.</text><text x="588" y="412" font-size="20" fill="#ffc878">Capture again to match the new position.</text><text x="588" y="443" font-size="18" fill="#c4cede">Use a runtime baker for moving blockers.</text></g></svg>