<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img"><title>Place volumes where lighting is needed</title><desc>Two schematic views: cover the player height in a room; overlap a higher-weight detail volume with a lower-weight background volume.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9baabe" stroke-width="1.5"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="2" fill="#7acdb3" opacity=".6"/></pattern></defs><rect width="100%" height="100%" rx="14" fill="#131922"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e7edf6"><text x="36" y="50" font-size="28" font-weight="600">Place volumes where lighting is needed</text><text x="36" y="82" font-size="17" fill="#c4cede">Schematic placement guide · the boxes show lighting coverage, not light sources.</text><text x="36" y="126" font-size="21" fill="#80dbc0">1  Cover the full height players and props can reach</text><rect x="54" y="154" width="580" height="190" fill="#1c2f32" stroke="#80dbc0" stroke-width="2" stroke-dasharray="8 5"/><rect x="54" y="154" width="580" height="190" fill="url(#grid)"/><path d="M78 344H616M78 144H616" stroke="#6a7586" stroke-width="8"/><g stroke="#edf4fc" stroke-width="6" fill="none" stroke-linecap="round"><circle cx="292" cy="218" r="15"/><path d="M292 235V275M292 246L266 267M292 246L318 267M292 275L272 338M292 275L312 338"/></g><text x="440" y="330" font-size="16" fill="#c4cede">floor</text><text x="662" y="194" font-size="19" fill="#edf4fc">Do not cover only the floor.</text><text x="662" y="226" font-size="18" fill="#c4cede">Include heads, raised hands,</text><text x="662" y="252" font-size="18" fill="#c4cede">stairs and movable props.</text><text x="662" y="301" font-size="17" fill="#c4cede">Use Preview Voxels to check density.</text><text x="36" y="394" font-size="21" fill="#80dbc0">2  Give a small detail volume a higher Weight</text><rect x="54" y="422" width="580" height="195" fill="#203035" stroke="#80dbc0" stroke-width="2"/><rect x="350" y="448" width="246" height="143" fill="#283e59" stroke="#8abcff" stroke-width="2"/><rect x="372" y="470" width="202" height="99" fill="#345271" stroke="#8abcff" stroke-dasharray="5 4"/><text x="80" y="461" font-size="20" fill="#80dbc0">Background volume</text><text x="80" y="490" font-size="18" fill="#c4cede">Weight 0</text><text x="387" y="511" font-size="20" fill="#cde2ff">Detail volume</text><text x="403" y="541" font-size="18" fill="#c4cede">Weight 1</text><text x="662" y="452" font-size="19" fill="#edf4fc">Higher Weight takes priority.</text><text x="662" y="483" font-size="18" fill="#c4cede">Smooth Blending fades the detail</text><text x="662" y="509" font-size="18" fill="#c4cede">volume into the background at its edge.</text><text x="662" y="558" font-size="18" fill="#c4cede">Increase density locally where the</text><text x="662" y="584" font-size="18" fill="#c4cede">lighting needs more detail.</text></g></svg>